name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main
      - master

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: us-central1
  SERVICE: fanpulse-live
  REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # -------------------------------------------------------------
      # METHOD A: Workload Identity Federation (Recommended & Secure)
      # -------------------------------------------------------------
      - name: Authenticate via Workload Identity Federation
        id: auth-wif
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
        continue-on-error: true

      # -------------------------------------------------------------
      # METHOD B: Service Account Key (Legacy/Fallback)
      # -------------------------------------------------------------
      - name: Authenticate via Service Account Key
        if: steps.auth-wif.outcome == 'failure' || secrets.GCP_WIF_PROVIDER == ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # -------------------------------------------------------------
      # Set up Docker Authentication
      # -------------------------------------------------------------
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      # -------------------------------------------------------------
      # Build and Push Container
      # -------------------------------------------------------------
      - name: Create Artifact Registry Repository (if not exists)
        run: |
          gcloud artifacts repositories create fanpulse-repo \
            --repository-format=docker \
            --location=${{ env.GAR_LOCATION }} \
            --description="Docker repository for FanPulse Live" \
            --quiet || true

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/fanpulse-repo/${{ env.SERVICE }}:${{ github.sha }}
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/fanpulse-repo/${{ env.SERVICE }}:latest

      # -------------------------------------------------------------
      # Deploy to Cloud Run
      # -------------------------------------------------------------
      - name: Deploy to Google Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/fanpulse-repo/${{ env.SERVICE }}:${{ github.sha }}
          flags: '--allow-unauthenticated'

      # -------------------------------------------------------------
      # Show the Deployed URL
      # -------------------------------------------------------------
      - name: Show URL
        run: echo "🚀 Successfully deployed! Live URL is ${{ steps.deploy.outputs.url }}"
